name: h169 k11 k51 composite shield

on:
  pull_request:
    paths:
      - 'research/verify_h169_k11_future_factor_partition.py'
      - 'research/verify_h169_k11_phase_k51_composite_shield.py'
      - 'research/H169-K11-PHASE-K51-COMPOSITE-SHIELD.md'
      - '.github/workflows/h169-k11-k51-composite-shield.yml'
  push:
    branches: [main]
    paths:
      - 'research/verify_h169_k11_future_factor_partition.py'
      - 'research/verify_h169_k11_phase_k51_composite_shield.py'
      - 'research/H169-K11-PHASE-K51-COMPOSITE-SHIELD.md'
      - '.github/workflows/h169-k11-k51-composite-shield.yml'

jobs:
  exact-k51-composite-shield:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Python
        run: dnf -y install git python3

      - uses: actions/checkout@v4

      - name: Compile verifier
        run: |
          python3 -m py_compile \
            research/verify_h169_k11_future_factor_partition.py \
            research/verify_h169_k11_phase_k51_composite_shield.py

      - name: Verify exact composite shield
        run: |
          python3 research/verify_h169_k11_phase_k51_composite_shield.py \
            > /tmp/h169-k11-k51-shield.json

      - name: Validate exact theorem certificate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          obj = json.loads(Path('/tmp/h169-k11-k51-shield.json').read_text())
          assert obj['verified'] is True
          assert obj['mode'] == 'h169-k11-phase-k51-composite-shield'

          phase = obj['phase']
          assert phase['t_mod_11'] == 0
          assert phase['T_mod_11'] == 8
          assert phase['forced_factor'] == 11
          assert phase['forced_shift'] == 51
          assert phase['consequence'] == '11|C51'

          assert obj['unit_group']['modulus'] == 51
          assert obj['unit_group']['order'] == 32

          generic = obj['generic_q51']
          assert generic['TypeII_miss_states'] == 3337
          assert generic['combined_miss_states'] == 1626
          assert generic['TypeI_only_states'] == 1711

          seeded = obj['seed11_q51']
          assert seeded['TypeII_miss_states'] == 636
          assert seeded['combined_miss_states'] == 268
          assert seeded['TypeI_only_states'] == 368

          contraction = obj['exact_contraction']
          assert contraction['TypeII_miss_state_ratio'] == '636/3337'
          assert contraction['states_removed'] == 2701

          shield = obj['jacobi_shield']
          assert shield['generator'] == 11
          assert shield['generator_order'] == 16
          assert shield['H_order'] == 16
          assert shield['H_index'] == 2
          assert shield['H_characterization'] == 'kernel of Jacobi symbol (./51)'
          assert shield['jacobi_11'] == 1
          assert shield['TypeII_target'] == 50
          assert shield['jacobi_TypeII_target'] == -1
          assert shield['TypeI_base_minus_inverse4'] == 38
          assert shield['jacobi_TypeI_base'] == -1

          cycle = obj['persistent_cycle']
          assert cycle['saturation_exponent'] == 8
          assert cycle['support_size_at_saturation'] == 16
          assert cycle['cycle_length'] == 16
          assert cycle['cycle_start_exponent'] == 8
          assert cycle['cycle_return_exponent'] == 24
          assert cycle['all_checked_states_combined_miss'] is True
          assert cycle['local_factor11_multiplicity_ceiling'] is None
          PY

      - name: Preserve exact proof object
        uses: actions/upload-artifact@v4
        with:
          name: h169-k11-k51-composite-shield
          path: /tmp/h169-k11-k51-shield.json
          if-no-files-found: error
          retention-days: 30
