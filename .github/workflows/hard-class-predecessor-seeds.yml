name: hard-class predecessor forced seeds

on:
  pull_request:
    paths:
      - 'kernel/analyze_brec_cylinder.py'
      - 'research/classify_signed_box_residue_automaton.py'
      - 'research/verify_k11_brec_obstruction_normal_form.py'
      - 'research/verify_k23_brec_ancestry_falsifiers.py'
      - 'research/verify_hard_class_predecessor_forced_seeds.py'
      - 'research/verify_h169_h289_h529_k11_brec_obstruction_normal_form.py'
      - 'research/verify_h289_k19_quotient_normal_form.py'
      - 'research/HARD-CLASS-PREDECESSOR-FORCED-SEEDS.md'
      - 'research/H169-H289-H529-K11-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/H289-K19-QUOTIENT-NORMAL-FORM.md'
      - '.github/workflows/hard-class-predecessor-seeds.yml'
  push:
    branches: [main]
    paths:
      - 'kernel/analyze_brec_cylinder.py'
      - 'research/classify_signed_box_residue_automaton.py'
      - 'research/verify_k11_brec_obstruction_normal_form.py'
      - 'research/verify_k23_brec_ancestry_falsifiers.py'
      - 'research/verify_hard_class_predecessor_forced_seeds.py'
      - 'research/verify_h169_h289_h529_k11_brec_obstruction_normal_form.py'
      - 'research/verify_h289_k19_quotient_normal_form.py'
      - '.github/workflows/hard-class-predecessor-seeds.yml'

jobs:
  exact-forced-seeds:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Python
        run: dnf -y install git python3

      - uses: actions/checkout@v4

      - name: Compile exact verifiers
        run: |
          python3 -m py_compile \
            kernel/analyze_brec_cylinder.py \
            research/classify_signed_box_residue_automaton.py \
            research/verify_k11_brec_obstruction_normal_form.py \
            research/verify_k23_brec_ancestry_falsifiers.py \
            research/verify_hard_class_predecessor_forced_seeds.py \
            research/verify_h169_h289_h529_k11_brec_obstruction_normal_form.py \
            research/verify_h289_k19_quotient_normal_form.py

      - name: Verify hard-class seed reductions
        run: |
          python3 research/verify_hard_class_predecessor_forced_seeds.py \
            > /tmp/hard-class-predecessor-seeds.json

      - name: Verify h169 h289 h529 k11 QR collapse
        run: |
          python3 research/verify_h169_h289_h529_k11_brec_obstruction_normal_form.py \
            > /tmp/h169-h289-h529-k11.json

      - name: Verify h289 k19 quotient normal form
        run: |
          python3 research/verify_h289_k19_quotient_normal_form.py \
            > /tmp/h289-k19-quotient.json

      - name: Validate exact conclusions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          obj = json.loads(Path('/tmp/hard-class-predecessor-seeds.json').read_text())
          k11 = json.loads(Path('/tmp/h169-h289-h529-k11.json').read_text())
          h289 = json.loads(Path('/tmp/h289-k19-quotient.json').read_text())

          assert obj['verified'] is True
          assert obj['hard_to_T_mod35'] == {
              '1': 1, '121': 6, '169': 8, '289': 13, '361': 16, '529': 23
          }
          rows = {row['p_mod_840']: row for row in obj['classes']}

          assert rows[169]['k11']['seed_residues'] == [3, 5]
          assert rows[289]['k11']['seed_residues'] == [3, 5]
          assert rows[529]['k11']['seed_residues'] == [3, 5]
          for hard in (169, 289, 529):
              assert rows[hard]['k11']['type_II_miss_states'] == 5
              assert rows[hard]['k11']['combined_miss_states'] == 5
              assert rows[hard]['k11']['type_I_only_states'] == 0

          assert rows[1]['k19']['seed_residues'] == [5]
          assert rows[1]['k19']['type_II_miss_states'] == 64
          assert rows[121]['k19']['seed_residues'] == [5, 7]
          assert rows[121]['k19']['type_II_miss_states'] == 9
          assert rows[121]['k19']['combined_miss_states'] == 9
          assert rows[121]['k19']['type_I_only_states'] == 0
          assert rows[169]['k19']['seed_residues'] == []
          assert rows[169]['k19']['type_II_miss_states'] == 254
          assert rows[289]['k19']['seed_residues'] == [7]
          assert rows[289]['k19']['type_II_miss_states'] == 27
          assert rows[361]['k19']['seed_residues'] == [5]
          assert rows[529]['k19']['seed_residues'] == []

          assert k11['verified'] is True
          assert k11['hard_classes'] == [169, 289, 529]
          seeded = k11['seeded_q11_automaton']
          assert seeded['seed_residues'] == [3, 5]
          assert seeded['type_II_miss_states'] == 5
          assert seeded['combined_miss_states'] == 5
          assert seeded['type_I_only_states'] == 0
          assert seeded['qr_only_combined_miss_states'] == 5

          regressions = {row['p']: row for row in k11['regressions']}
          for p in (2689, 12049, 5569):
              assert regressions[p]['sign'] == '-'
              assert regressions[p]['general_k11_branch'] == 'pure-QR'
              assert regressions[p]['all_prime_divisors_QR_mod_11'] is True
          for p in (1009, 1129, 3049):
              assert regressions[p]['sign'] == '+'
              assert regressions[p]['all_prime_divisors_QR_mod_11'] is False

          assert h289['verified'] is True
          assert h289['hard_forcing']['p_mod_840'] == 289
          assert h289['hard_forcing']['forced_prime'] == 7
          assert h289['hard_forcing']['forced_support_exponents'] == [0, 6, 12]
          q = h289['quotient']
          assert q['quotient_states'] == 9
          assert q['quotient_combined_miss_states'] == 6
          assert q['quotient_type_I_only_states'] == 3
          assert q['full_seeded_states'] == 27
          assert q['full_combined_miss_states'] == 18
          assert q['full_type_I_only_states'] == 9
          assert q['fiber_size'] == 3
          assert len(q['table']) == 9

          h289_reg = {row['p']: row for row in h289['regressions']}
          assert h289_reg[1129]['exact_hit_class'] == 'type-I-only'
          assert h289_reg[8689]['exact_hit_class'] == 'miss'
          assert h289_reg[22129]['exact_hit_class'] == 'type-II-only'
          PY

      - name: Preserve exact seeded-state tables
        uses: actions/upload-artifact@v4
        with:
          name: hard-class-predecessor-forced-seeds
          path: |
            /tmp/hard-class-predecessor-seeds.json
            /tmp/h169-h289-h529-k11.json
            /tmp/h289-k19-quotient.json
          if-no-files-found: error
          retention-days: 30
