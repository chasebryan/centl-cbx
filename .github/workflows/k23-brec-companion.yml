name: k23 BREC companion exact checks

on:
  pull_request:
    paths:
      - 'kernel/analyze_brec_cylinder.py'
      - 'research/verify_k3_brec_obstruction_normal_form.py'
      - 'research/verify_k7_brec_obstruction_normal_form.py'
      - 'research/verify_k11_brec_obstruction_normal_form.py'
      - 'research/verify_k15_brec_obstruction_normal_form.py'
      - 'research/verify_k23_typei_companion_patterns.py'
      - 'research/verify_k23_brec_ancestry_falsifiers.py'
      - 'research/verify_k23_typei_only_integer_normal_form.py'
      - 'research/verify_k23_rescue_split_hard_classes.py'
      - 'research/K3-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/K7-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/K11-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/K15-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/K23-BREC-TWO-TARGET-COINCIDENCE.md'
      - 'research/K23-TYPEI-ONLY-INTEGER-NORMAL-FORM.md'
      - 'research/K23-RESCUE-SPLIT-HARD-CLASS-COMPATIBILITY.md'
      - '.github/workflows/k23-brec-companion.yml'
  push:
    branches: [main]
    paths:
      - 'kernel/analyze_brec_cylinder.py'
      - 'research/verify_k3_brec_obstruction_normal_form.py'
      - 'research/verify_k7_brec_obstruction_normal_form.py'
      - 'research/verify_k11_brec_obstruction_normal_form.py'
      - 'research/verify_k15_brec_obstruction_normal_form.py'
      - 'research/verify_k23_typei_companion_patterns.py'
      - 'research/verify_k23_brec_ancestry_falsifiers.py'
      - 'research/verify_k23_typei_only_integer_normal_form.py'
      - 'research/verify_k23_rescue_split_hard_classes.py'
      - '.github/workflows/k23-brec-companion.yml'

jobs:
  exact-k23-companion:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Python
        run: dnf -y install git python3

      - uses: actions/checkout@v4

      - name: Compile exact research verifiers
        run: |
          python3 -m py_compile \
            kernel/analyze_brec_cylinder.py \
            research/verify_k3_brec_obstruction_normal_form.py \
            research/verify_k7_brec_obstruction_normal_form.py \
            research/verify_k11_brec_obstruction_normal_form.py \
            research/verify_k15_brec_obstruction_normal_form.py \
            research/verify_k23_typei_companion_patterns.py \
            research/verify_k23_brec_ancestry_falsifiers.py \
            research/verify_k23_typei_only_integer_normal_form.py \
            research/verify_k23_rescue_split_hard_classes.py

      - name: Verify exact k3 obstruction normal form
        run: |
          python3 research/verify_k3_brec_obstruction_normal_form.py \
            > /tmp/k3-obstruction-normal-form.json

      - name: Verify exact k7 obstruction normal form
        run: |
          python3 research/verify_k7_brec_obstruction_normal_form.py \
            > /tmp/k7-obstruction-normal-form.json

      - name: Verify exact k11 obstruction normal form
        run: |
          python3 research/verify_k11_brec_obstruction_normal_form.py \
            > /tmp/k11-obstruction-normal-form.json

      - name: Verify exact k15 obstruction normal form
        run: |
          python3 research/verify_k15_brec_obstruction_normal_form.py \
            > /tmp/k15-obstruction-normal-form.json

      - name: Verify q23 Type-I companion residue classification
        run: |
          python3 research/verify_k23_typei_companion_patterns.py \
            > /tmp/k23-companion-patterns.json

      - name: Verify ancestry-coincidence falsifiers
        run: |
          python3 research/verify_k23_brec_ancestry_falsifiers.py \
            > /tmp/k23-ancestry-falsifiers.json

      - name: Verify Type-I-only integer normal form
        run: |
          python3 research/verify_k23_typei_only_integer_normal_form.py \
            > /tmp/k23-integer-normal-form.json

      - name: Verify rescue split hard-class compatibility
        run: |
          python3 research/verify_k23_rescue_split_hard_classes.py \
            > /tmp/k23-rescue-split-hard-classes.json

      - name: Validate exact conclusions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          k3 = json.loads(Path('/tmp/k3-obstruction-normal-form.json').read_text())
          k7 = json.loads(Path('/tmp/k7-obstruction-normal-form.json').read_text())
          k11 = json.loads(Path('/tmp/k11-obstruction-normal-form.json').read_text())
          k15 = json.loads(Path('/tmp/k15-obstruction-normal-form.json').read_text())
          patterns = json.loads(Path('/tmp/k23-companion-patterns.json').read_text())
          falsifiers = json.loads(Path('/tmp/k23-ancestry-falsifiers.json').read_text())
          normal = json.loads(Path('/tmp/k23-integer-normal-form.json').read_text())
          split = json.loads(Path('/tmp/k23-rescue-split-hard-classes.json').read_text())

          assert k3['verified'] is True
          assert k3['combined_target'] == 2
          assert k3['miss_iff'] == 'every prime divisor q of C3=(p+3)/4 is 1 mod 3'

          assert k7['verified'] is True
          assert k7['two_target_coincidence'] is True
          assert k7['QR7'] == [1, 2, 4]
          assert k7['NR7'] == [3, 5, 6]

          assert k11['verified'] is True
          assert k11['pure_QR_branch']['combined_miss'] is True
          k11_states = {(s['a2'], s['a6']): s for s in k11['thin_states']}
          assert k11_states[(2, 0)]['hit_class'] == 'type-I-only'
          assert k11_states[(0, 2)]['hit_class'] == 'type-I-only'
          assert k11_states[(1, 1)]['hit_class'] == 'miss'
          assert k11['thin_type_I_only_packets'] == [[0, 2], [2, 0]]
          assert k11['thin_combined_miss_packets'] == [[0, 0], [0, 1], [1, 0], [1, 1]]

          assert k15['verified'] is True
          assert k15['H'] == [1, 2, 4, 8]
          assert k15['minus_H'] == [7, 11, 13, 14]
          assert k15['forced_v1_support'] == [1, 2, 8]
          assert k15['forced_v2_support'] == [1, 2, 4, 8]
          assert k15['combined_miss_iff'] == (
              'every prime divisor q of C15=(p+15)/4 lies in {1,2,4,8} mod 15'
          )

          assert patterns['verified'] is True
          assert [p['name'] for p in patterns['type_I_only_patterns']] == ['5^2', '14^2']
          states = {(s['a5'], s['a14']): s for s in patterns['states']}
          assert states[(2, 0)]['hit_class'] == 'type-I-only'
          assert states[(0, 2)]['hit_class'] == 'type-I-only'
          assert states[(1, 1)]['hit_class'] == 'miss'

          assert falsifiers['verified'] is True
          assert falsifiers['deep_rescue_patterns_realized'] == ['5^2', '14^2']
          witnesses = {w['p']: w for w in falsifiers['witnesses']}
          assert witnesses[5151841]['early_history'] == '-++-+'
          assert witnesses[18766609]['early_history'] == '-----'
          assert witnesses[27211969]['early_history'] == '-----'

          assert normal['verified'] is True
          assert normal['full_five_miss_branches_realized'] == [5, 14]
          assert normal['predecessor_block'] == [
              '6T-5', '6T-4', '6T-3', '6T-2', '6T-1', '6T'
          ]
          hard = {row['p_mod_840']: row['T_mod_35'] for row in normal['hard_class_map']}
          assert hard == {1: 1, 121: 6, 169: 8, 289: 13, 361: 16, 529: 23}

          assert split['verified'] is True
          assert split['modulus'] == 805
          assert split['combinations_verified'] == 24
          rescue = {row['rho']: row['class_mod_805'] for row in split['rescue_crt_classes']}
          assert rescue == {5: 281, 14: 106}
          PY
