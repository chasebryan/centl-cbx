name: non-descent valuation cost

on:
  pull_request:
    paths:
      - 'research/NON-DESCENT-VALUATION-COST.md'
      - 'research/verify_non_descent_valuation_cost.py'
      - '.github/workflows/non-descent-valuation-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python3 -m py_compile research/verify_non_descent_valuation_cost.py
      - name: Verify non-descent cost theorem
        run: python3 research/verify_non_descent_valuation_cost.py --json
