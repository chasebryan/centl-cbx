name: h169 cross-coordinate obligation cores

on:
  pull_request:
    paths:
      - 'research/propagate_h169_dependency_state.py'
      - 'research/verify_k19_nr_valuation_budget.py'
      - 'research/verify_h169_k11_future_factor_partition.py'
      - 'research/verify_h169_k11_phase_k43_seed.py'
      - 'research/verify_h169_k11_phase_k51_composite_shield.py'
      - 'research/analyze_h169_cross_obligation_core.py'
      - 'research/H169-CROSS-OBLIGATION-CORE.md'
      - '.github/workflows/h169-cross-obligation-core.yml'
  push:
    branches: [main]
    paths:
      - 'research/propagate_h169_dependency_state.py'
      - 'research/verify_k19_nr_valuation_budget.py'
      - 'research/verify_h169_k11_future_factor_partition.py'
      - 'research/verify_h169_k11_phase_k43_seed.py'
      - 'research/verify_h169_k11_phase_k51_composite_shield.py'
      - 'research/analyze_h169_cross_obligation_core.py'
      - '.github/workflows/h169-cross-obligation-core.yml'

jobs:
  exact-cross-cores:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Python
        run: dnf -y install git python3

      - uses: actions/checkout@v4

      - name: Compile analyzers
        run: |
          python3 -m py_compile \
            research/propagate_h169_dependency_state.py \
            research/verify_k19_nr_valuation_budget.py \
            research/verify_h169_k11_future_factor_partition.py \
            research/verify_h169_k11_phase_k43_seed.py \
            research/verify_h169_k11_phase_k51_composite_shield.py \
            research/analyze_h169_cross_obligation_core.py

      - name: Run cross-core self-test
        run: python3 research/analyze_h169_cross_obligation_core.py --self-test

      - name: Emit canonical cross contradiction
        run: |
          python3 research/analyze_h169_cross_obligation_core.py \
            --route B \
            --state-json '{"t_mod_11":8,"k19_mode":"BARE"}' \
            > /tmp/h169-cross-core.json

      - name: Emit live phase-8 obligation ledger
        run: |
          python3 research/analyze_h169_cross_obligation_core.py \
            --route A \
            --state-json '{"t_mod_11":8}' \
            > /tmp/h169-cross-live.json

      - name: Emit live phase-2 k43 resource ledger
        run: |
          python3 research/analyze_h169_cross_obligation_core.py \
            --route A \
            --state-json '{"t_mod_11":2}' \
            > /tmp/h169-cross-k43.json

      - name: Emit live phase-0 k51 shield ledger
        run: |
          python3 research/analyze_h169_cross_obligation_core.py \
            --route B \
            --state-json '{"t_mod_11":0}' \
            > /tmp/h169-cross-k51.json

      - name: Validate exact explanations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          bad = json.loads(Path('/tmp/h169-cross-core.json').read_text())
          live = json.loads(Path('/tmp/h169-cross-live.json').read_text())
          k43 = json.loads(Path('/tmp/h169-cross-k43.json').read_text())
          k51 = json.loads(Path('/tmp/h169-cross-k51.json').read_text())

          assert bad['analysis'] == 'h169-cross-obligation-core-v3'
          assert bad['base_surviving_formal_tuples'] == 147900
          assert bad['cross_surviving_formal_tuples'] == 0
          assert bad['contradiction'] is True
          core = bad['contradiction_core']
          assert core['atom_count'] == 4
          assert core['minimum_cardinality_claimed'] is False
          assert core['each_retained_atom_is_necessary'] is True
          assumptions = {
              atom['field']: tuple(atom['allowed'])
              for atom in core['atoms']
              if atom['kind'] == 'assumption'
          }
          assert assumptions == {
              't_mod_11': (8,),
              'k19_mode': ('BARE',),
          }
          theorems = {
              atom['name']
              for atom in core['atoms']
              if atom['kind'] == 'theorem'
          }
          assert theorems == {
              'h169-k11-phase-factor11-in-R',
              'k19-bare-excludes-factor11-in-R',
          }

          assert live['base_surviving_formal_tuples'] == 105600
          assert live['cross_surviving_formal_tuples'] > 0
          assert live['contradiction'] is False
          obligations = live['obligations']
          assert obligations['forced']['t_mod_11'] == 8
          assert obligations['forced']['factor11_in_R'] is True
          assert obligations['forced']['k19_mode'] == 'FULL_QR'
          factor = obligations['factor11_obligation']
          assert factor['literal_prime'] == 11
          assert factor['reservoir'] == 'R'
          assert factor['k19_BARE_compatible'] is False
          assert factor['k19_TypeII_miss_max_Omega_NR'] == 2
          assert factor['positive_NR_edges_inside_seeded_SCCs'] == 0

          assert k43['analysis'] == 'h169-cross-obligation-core-v3'
          assert k43['contradiction'] is False
          obligations = k43['obligations']
          assert obligations['forced']['t_mod_11'] == 2
          resource = obligations['k43_seed_obligation']
          assert resource['literal_prime'] == 11
          assert resource['destination_shift'] == 43
          assert resource['forced_consequence'] == '11|C43'
          assert resource['generic_TypeII_miss_states'] == 18048
          assert resource['seed11_TypeII_miss_states'] == 2317
          assert resource['seed11_combined_miss_states'] == 1217
          assert resource['seed11_TypeI_only_states'] == 1100
          assert resource['generic_max_Omega_NR'] == 20
          assert resource['seed11_max_Omega_NR'] == 14
          assert resource['positive_NR_edges_inside_seeded_SCCs'] == 0
          assert resource['state_ratio'] == '2317/18048'
          assert resource['states_removed'] == 15731

          assert k51['analysis'] == 'h169-cross-obligation-core-v3'
          assert k51['contradiction'] is False
          obligations = k51['obligations']
          assert obligations['forced']['t_mod_11'] == 0
          resource = obligations['k51_composite_shield_obligation']
          assert resource['literal_prime'] == 11
          assert resource['destination_shift'] == 51
          assert resource['forced_consequence'] == '11|C51'
          assert resource['generic_TypeII_miss_states'] == 3337
          assert resource['seed11_TypeII_miss_states'] == 636
          assert resource['seed11_combined_miss_states'] == 268
          assert resource['seed11_TypeI_only_states'] == 368
          assert resource['state_ratio'] == '636/3337'
          assert resource['states_removed'] == 2701
          assert resource['shield_order'] == 16
          assert resource['shield_index'] == 2
          assert resource['shield_characterization'] == 'kernel of Jacobi symbol (./51)'
          assert resource['shield_generator_order'] == 16
          assert resource['TypeII_target_outside_shield'] is True
          assert resource['TypeI_base_outside_shield'] is True
          assert resource['support_saturation_exponent'] == 8
          assert resource['persistent_cycle_length'] == 16
          assert resource['local_factor11_multiplicity_ceiling'] is None
          PY

      - name: Preserve explanation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h169-cross-obligation-core
          path: |
            /tmp/h169-cross-core.json
            /tmp/h169-cross-live.json
            /tmp/h169-cross-k43.json
            /tmp/h169-cross-k51.json
          if-no-files-found: error
          retention-days: 30
