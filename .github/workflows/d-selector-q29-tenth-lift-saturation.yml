name: D-selector q29 tenth-lift saturation

on:
  pull_request:
    paths:
      - 'research/D-SELECTOR-Q29-TENTH-LIFT-SATURATION.md'
      - 'research/verify_d_selector_q29_tenth_lift_saturation.py'
      - '.github/workflows/d-selector-q29-tenth-lift-saturation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python3 -m py_compile research/verify_d_selector_q29_tenth_lift_saturation.py
      - name: Verify q29 tenth-lift saturation and q317 extraction
        run: python3 research/verify_d_selector_q29_tenth_lift_saturation.py --json
