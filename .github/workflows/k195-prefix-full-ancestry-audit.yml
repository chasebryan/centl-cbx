name: k195 deterministic prefix ancestry audit

on:
  pull_request:
    paths:
      - 'research/K195-PREFIX-FULL-ANCESTRY-AUDIT.md'
      - 'research/verify_k195_prefix_full_ancestry_audit.py'
      - '.github/workflows/k195-prefix-full-ancestry-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python3 -m py_compile research/verify_k195_prefix_full_ancestry_audit.py
      - name: Run deterministic full-ancestry prefix audit
        run: python3 research/verify_k195_prefix_full_ancestry_audit.py --json
