name: q23 rescue k19 frontier

on:
  workflow_dispatch:
    inputs:
      p_hi:
        description: Prime ceiling for exact q23 rescue frontier
        required: true
        default: '100000000'
        type: string
      branch_class:
        description: q23 D class, blank for both
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'research/search_q23_typei_rescue_branch.py'
      - 'research/analyze_q23_rescue_k19_frontier.py'
      - 'research/verify_k19_brec_state_compression.py'
      - 'research/K3-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/K7-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/K11-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - 'research/K15-BREC-OBSTRUCTION-NORMAL-FORM.md'
      - '.github/workflows/q23-k19-frontier.yml'

jobs:
  exact-k19-frontier:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      FRONTIER_P_HI: ${{ github.event_name == 'workflow_dispatch' && inputs.p_hi || '30000000' }}
      FRONTIER_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch_class || '' }}
    steps:
      - name: Install Python
        run: dnf -y install git python3

      - uses: actions/checkout@v4

      - name: Compile exact frontier tools
        run: |
          python3 -m py_compile \
            kernel/analyze_brec_cylinder.py \
            research/search_q23_typei_rescue_branch.py \
            research/verify_k19_brec_state_compression.py \
            research/analyze_q23_rescue_k19_frontier.py

      - name: Self-test forward rescue branch
        run: python3 research/search_q23_typei_rescue_branch.py --self-test

      - name: Self-test k19 frontier analyzer
        run: python3 research/analyze_q23_rescue_k19_frontier.py --self-test

      - name: Run exact k19 frontier census
        shell: bash
        run: |
          args=(
            "--p-hi=$FRONTIER_P_HI"
            "--prefix=----"
            --json
          )
          if [[ -n "$FRONTIER_BRANCH" ]]; then
            args+=("--branch-class=$FRONTIER_BRANCH")
          fi
          python3 research/analyze_q23_rescue_k19_frontier.py "${args[@]}" \
            > /tmp/q23-k19-frontier.json

      - name: Validate exact frontier output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          obj = json.loads(Path('/tmp/q23-k19-frontier.json').read_text())
          assert obj['mode'] == 'analyze-q23-rescue-k19-frontier'
          assert obj['required_parent_prefix'] == '----'
          assert obj['candidates'] == obj['k19_misses'] + obj['k19_constructive']
          assert sum(obj['k19_hit_classes'].values()) == obj['candidates']
          assert sum(obj['k19_cyclic_state_counts'].values()) == obj['candidates']
          assert sum(obj['k19_canonical_depth_counts'].values()) == obj['candidates']
          assert obj['k19_state_theorem'] == {
              'reachable_states': 439,
              'combined_miss_states': 136,
              'max_canonical_miss_atoms': 3,
          }
          for hit_class, rows in obj['examples_by_hit_class'].items():
              for row in rows:
                  assert row['early_history'].startswith('----')
                  assert row['k19']['hit_class'] == hit_class
                  assert row['C19'] == 6 * row['M'] - 1
                  cyclic = row['cyclic_state']
                  assert cyclic['support_size'] == row['k19']['support_size']
                  assert cyclic['combined_miss'] == (hit_class == 'miss')
                  if hit_class == 'miss':
                      assert cyclic['canonical_depth'] <= 3
          PY

      - name: Preserve k19 frontier census
        uses: actions/upload-artifact@v4
        with:
          name: q23-k19-frontier-${{ env.FRONTIER_P_HI }}
          path: /tmp/q23-k19-frontier.json
          if-no-files-found: error
          retention-days: 30
