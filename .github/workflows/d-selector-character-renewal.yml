name: D-selector mixed-character renewal

on:
  pull_request:
    paths:
      - 'research/D-SELECTOR-MIXED-CHARACTER-RENEWAL.md'
      - 'research/verify_d_selector_mixed_character_renewal.py'
      - '.github/workflows/d-selector-character-renewal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile verifier
        run: python3 -m py_compile research/verify_d_selector_mixed_character_renewal.py
      - name: Verify exact character renewal
        run: python3 research/verify_d_selector_mixed_character_renewal.py --json
